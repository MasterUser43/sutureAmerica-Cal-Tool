<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar Event List Generator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        button { padding: 10px 15px; margin: 10px 5px 10px 0; background: #0073aa; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005177; }
        button#copyButton { background: #46b450; }
        button#copyButton:hover { background: #3a9e43; }
        #outputContainer { border: 1px solid #ddd; padding: 20px; margin-top: 20px; border-radius: 4px; }
        #eventList { background-color: #f6f7f7; padding: 15px; white-space: pre-wrap; font-family: monospace; line-height: 1.6; }
        .success { color: #46b450; font-weight: bold; }
        .error { color: #d63638; font-weight: bold; }
        .warning { color: #ffb900; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Google Calendar Event List Generator</h1>
    <p>Click the button to fetch your events and generate a plain text list for easy copying.</p>
    <p><strong>iCal Feed URL:</strong> <code id="currentUrl">Loading...</code></p>
    
    <button id="fetchButton">Fetch Events and Generate List</button>
    
    <div id="status"></div>
    
    <div id="outputContainer" style="display: none;">
        <h3>Event List (Click to Copy):</h3>
        <button id="copyButton">Copy All to Clipboard</button>
        <div id="eventList"></div>
    </div>

    <script>
        // Note: Ensure "Make available to public" is checked in Google Calendar settings!
        const iCalFeedURL = 'https://calendar.google.com/calendar/ical/6ece6a621800774d05685ba3f1ab476905e7f95342632eccc111ec12abdddb2e%40group.calendar.google.com/public/basic.ics';
        document.getElementById('currentUrl').textContent = iCalFeedURL;

        // Function that tries multiple proxies automatically if one fails
        async function fetchWithProxyFallback(url) {
            const proxies = [
                'https://api.codetabs.com/v1/proxy?quest=', // Highly reliable text proxy
                'https://api.allorigins.win/raw?url=',      // Good fallback
                'https://corsproxy.io/?'                    // Original proxy (often blocked)
            ];

            const encodedUrl = encodeURIComponent(url);

            for (let i = 0; i < proxies.length; i++) {
                try {
                    console.log(`Trying proxy ${i + 1}: ${proxies[i]}`);
                    const response = await fetch(proxies[i] + encodedUrl);
                    
                    if (!response.ok) continue; // Try the next proxy
                    
                    const icalData = await response.text();
                    
                    // Verify it's actually calendar data and not an HTML error page
                    if (icalData.includes('BEGIN:VCALENDAR')) {
                        console.log(`Success with proxy ${i + 1}`);
                        return icalData; 
                    }
                } catch (error) {
                    console.warn(`Proxy ${i + 1} failed:`, error);
                }
            }
            
            throw new Error('All proxies failed. Ensure your calendar has "Make available to public" checked in Google Settings.');
        }

        document.getElementById('fetchButton').addEventListener('click', async function() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Fetching calendar data (trying proxies)...';
            statusEl.className = 'warning';
            document.getElementById('outputContainer').style.display = 'none';
            
            try {
                // Fetch using our auto-fallback function
                const icalData = await fetchWithProxyFallback(iCalFeedURL);
                
                statusEl.textContent = 'Data fetched! Processing...';
                
                const events = parseICalData(icalData);
                const filteredEvents = filterAndSortFutureEvents(events);
                
                if (filteredEvents.length === 0) {
                    statusEl.textContent = 'No upcoming events found.';
                    statusEl.className = '';
                    return;
                }
                
                generateEventList(filteredEvents);
                statusEl.textContent = `Done! Found ${filteredEvents.length} events.`;
                statusEl.className = 'success';
                
            } catch (error) {
                console.error('Final Error:', error);
                statusEl.textContent = error.message;
                statusEl.className = 'error';
            }
        });

        document.getElementById('copyButton').addEventListener('click', function() {
            const eventListText = document.getElementById('eventList').textContent;
            navigator.clipboard.writeText(eventListText).then(() => {
                alert('Event list copied to clipboard!');
            });
        });

        function parseICalData(icalData) {
            const events = [];
            const lines = icalData.split('\n');
            let currentEvent = null;
            let inEvent = false;

            for (const line of lines) {
                if (line.startsWith('BEGIN:VEVENT')) {
                    inEvent = true;
                    currentEvent = {};
                } else if (line.startsWith('END:VEVENT')) {
                    inEvent = false;
                    if (currentEvent && currentEvent.summary) {
                        events.push(currentEvent);
                    }
                    currentEvent = null;
                } else if (inEvent && currentEvent) {
                    const [key, ...valueParts] = line.split(':');
                    const value = valueParts.join(':');
                    
                    if (key.startsWith('SUMMARY')) {
                        currentEvent.summary = value.trim();
                    } else if (key.startsWith('DTSTART')) {
                        currentEvent.start = value.trim();
                    } else if (key.startsWith('DTEND')) {
                        currentEvent.end = value.trim();
                    }
                }
            }
            return events;
        }

        function filterAndSortFutureEvents(events) {
            const now = new Date();
            now.setHours(0,0,0,0); 

            const futureEvents = events.filter(event => {
                if (!event.start) return false;
                const eventDate = convertICalDateToJSDate(event.start);
                return eventDate >= now;
            });
            
            return futureEvents.sort((a, b) => {
                const dateA = convertICalDateToJSDate(a.start);
                const dateB = convertICalDateToJSDate(b.start);
                return dateA - dateB;
            });
        }

        function convertICalDateToJSDate(icalDate) {
            const year = parseInt(icalDate.substring(0, 4));
            const month = parseInt(icalDate.substring(4, 6)) - 1; 
            const day = parseInt(icalDate.substring(6, 8));
            
            let hour = 0, minute = 0;
            
            if (icalDate.includes('T')) {
                hour = parseInt(icalDate.substring(9, 11)) || 0;
                minute = parseInt(icalDate.substring(11, 13)) || 0;
            }
            
            return new Date(Date.UTC(year, month, day, hour, minute));
        }

        function formatEventDisplayDate(jsDate) {
            const day = jsDate.getDate();
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            
            const month = monthNames[jsDate.getMonth()];
            const year = "'" + jsDate.getFullYear().toString().slice(-2);
            const dayOfWeek = dayNames[jsDate.getDay()];
            
            return `${day} ${month} ${year}, ${dayOfWeek}`;
        }

        function formatTimeRange(startDate, endDate) {
            if (startDate.getHours() === 0 && startDate.getMinutes() === 0 && 
                endDate.getHours() === 0 && endDate.getMinutes() === 0) {
                return "All Day";
            }
            
            const formatTime = (date) => {
                let hours = date.getHours();
                let minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12; 
                minutes = minutes < 10 ? '0' + minutes : minutes;
                
                return `${hours}:${minutes} ${ampm}`;
            };
            
            return `${formatTime(startDate)} - ${formatTime(endDate)}`;
        }

        function generateEventList(events) {
            let eventListText = '';
            
            events.forEach(event => {
                const startDate = convertICalDateToJSDate(event.start);
                const endDate = convertICalDateToJSDate(event.end || event.start);
                const dateStr = formatEventDisplayDate(startDate);
                const timeRangeStr = formatTimeRange(startDate, endDate);
                
                eventListText += `${dateStr} | ${timeRangeStr} | ${event.summary}\n`;
            });
            
            document.getElementById('eventList').textContent = eventListText;
            document.getElementById('outputContainer').style.display = 'block';
        }
    </script>
</body>
</html>
