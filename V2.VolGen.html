<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Calendar Event List Generator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        button { padding: 10px 15px; margin: 10px 5px 10px 0; background: #0073aa; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #005177; }
        button#copyButton { background: #46b450; }
        button#copyButton:hover { background: #3a9e43; }
        #outputContainer { border: 1px solid #ddd; padding: 20px; margin-top: 20px; border-radius: 4px; }
        #eventList { background-color: #f6f7f7; padding: 15px; white-space: pre-wrap; font-family: monospace; line-height: 1.6; }
        .success { color: #46b450; font-weight: bold; }
        .loading { color: #0073aa; }
        .error { color: #d63638; font-weight: bold; }
    </style>
    <!-- Load ical.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
</head>
<body>

    <h1>Google Calendar Event List Generator</h1>
    <p>Click the button to fetch events from today through the next 2 weeks.</p>
    <p><strong>iCal Feed URL:</strong> <code id="currentUrl">Loading...</code></p>
    
    <button id="fetchButton">Fetch Events (Next 2 Weeks)</button>
    
    <div id="status"></div>
    
    <div id="outputContainer" style="display: none;">
        <h3>Event List (Next 2 Weeks):</h3>
        <button id="copyButton">Copy All to Clipboard</button>
        <div id="eventList"></div>
    </div>

    <script>
        // Use the PUBLIC URL to prevent proxy issues and secure your private token
        const iCalFeedURL = 'https://calendar.google.com/calendar/ical/sutureamerica%40gmail.com/public/basic.ics';
        document.getElementById('currentUrl').textContent = iCalFeedURL;

        document.getElementById('fetchButton').addEventListener('click', function() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Fetching calendar data...';
            statusEl.className = 'loading';
            
            // Switched to a more reliable proxy: allorigins
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(iCalFeedURL);
            
            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                    return response.text();
                })
                .then(icalData => {
                    // Check if we actually got an iCal file back, and not an HTML error page from the proxy
                    if (!icalData.includes('BEGIN:VCALENDAR')) {
                        console.error("Received invalid data:", icalData.substring(0, 200));
                        throw new Error('The proxy returned invalid data (not an iCal file).');
                    }

                    statusEl.textContent = 'Processing calendar data...';
                    try {
                        const jcalData = ICAL.parse(icalData);
                        const comp = new ICAL.Component(jcalData);
                        const vevents = comp.getAllSubcomponents('vevent');
                        
                        const allEvents = [];
                        const now = new Date();
                        now.setHours(0, 0, 0, 0);
                        
                        const twoWeeksFromNow = new Date();
                        twoWeeksFromNow.setDate(now.getDate() + 14);
                        twoWeeksFromNow.setHours(23, 59, 59, 999);
                        
                        vevents.forEach(vevent => {
                            const event = new ICAL.Event(vevent);
                            
                            if (event.isRecurring()) {
                                const iterator = event.iterator();
                                let next;
                                
                                while ((next = iterator.next())) {
                                    const nextDate = next.toJSDate();
                                    if (nextDate > twoWeeksFromNow) break;
                                    
                                    if (nextDate >= now) {
                                        const eventDuration = event.endDate.toJSDate() - event.startDate.toJSDate();
                                        const eventEnd = new Date(nextDate.getTime() + eventDuration);
                                        
                                        allEvents.push({
                                            summary: event.summary,
                                            start: nextDate,
                                            end: eventEnd
                                        });
                                    }
                                }
                            } else {
                                const startDate = event.startDate.toJSDate();
                                if (startDate >= now && startDate <= twoWeeksFromNow) {
                                    allEvents.push({
                                        summary: event.summary,
                                        start: startDate,
                                        end: event.endDate.toJSDate()
                                    });
                                }
                            }
                        });
                        
                        allEvents.sort((a, b) => a.start - b.start);
                        
                        if (allEvents.length === 0) {
                            statusEl.textContent = 'No events found for the next 2 weeks.';
                            statusEl.className = '';
                            return;
                        }
                        
                        generateEventList(allEvents);
                        statusEl.textContent = `Done! Found ${allEvents.length} events for the next 2 weeks.`;
                        statusEl.className = 'success';
                        
                    } catch (error) {
                        console.error('Parsing Error:', error);
                        statusEl.textContent = 'Error processing calendar data. Check console.';
                        statusEl.className = 'error';
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    statusEl.textContent = 'Failed to fetch calendar. Proxy or network issue. Check console.';
                    statusEl.className = 'error';
                });
        });

        document.getElementById('copyButton').addEventListener('click', function() {
            const eventListText = document.getElementById('eventList').textContent;
            navigator.clipboard.writeText(eventListText).then(() => {
                alert('Event list copied to clipboard!');
            });
        });

        function formatEventDisplayDate(jsDate) {
            const day = jsDate.getDate();
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            
            const month = monthNames[jsDate.getMonth()];
            const year = "'" + jsDate.getFullYear().toString().slice(-2);
            const dayOfWeek = dayNames[jsDate.getDay()];
            
            return `${day} ${month} ${year}, ${dayOfWeek}`;
        }

        function formatTimeRange(startDate, endDate) {
            const duration = endDate - startDate;
            const isAllDay = duration === 24 * 60 * 60 * 1000 && 
                            startDate.getHours() === 0 && 
                            startDate.getMinutes() === 0;
            
            if (isAllDay) return "All Day";
            
            const formatTime = (date) => {
                let hours = date.getHours();
                let minutes = date.getMinutes();
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                return `${hours}:${minutes} ${ampm}`;
            };
            
            return `${formatTime(startDate)} - ${formatTime(endDate)}`;
        }

        function generateEventList(events) {
            let eventListText = '';
            
            events.forEach(event => {
                try {
                    const dateStr = formatEventDisplayDate(event.start);
                    const timeRangeStr = formatTimeRange(event.start, event.end);
                    eventListText += `${dateStr} | ${timeRangeStr} | ${event.summary}\n`;
                } catch (e) {
                    console.warn('Skipping event due to error:', event, e);
                }
            });
            
            document.getElementById('eventList').textContent = eventListText;
            document.getElementById('outputContainer').style.display = 'block';
        }
    </script>
</body>
</html>
